services:
  db:
    image: postgres:16-alpine
    container_name: bridgefood-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bridgefood
      POSTGRES_USER: bridgefood
      POSTGRES_PASSWORD: bridgefood_dev
    ports:
      - "5432:5432"
    volumes:
      - bridgefood_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgefood -d bridgefood"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bridgefood_pgdata:
